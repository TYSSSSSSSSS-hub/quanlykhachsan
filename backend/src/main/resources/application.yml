server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  application:
    name: hotel-management
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hotel_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:S1a2n3g4@2006}
  
  h2:
    console:
      enabled: false

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true
        connection:
          characterEncoding: UTF-8
          charSet: UTF-8
          useUnicode: true

  sql:
    init:
      mode: never

jwt:
  secret: ${JWT_SECRET:HotelManagementSecretKey98765432101234567890HotelManagementSecretKey}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
